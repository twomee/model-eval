# Category: system_design — no single right answer, so a rubric judge.
# Write criteria as OBSERVABLE behaviours ("states what it would measure first"),
# not vibes ("is insightful"). Vague criteria -> judges disagree -> noisy scores.

- id: design_webhook_idempotency
  category: system_design
  prompt: |
    We receive payment webhooks from an external provider, up to 300 per second at peak. Delivery is at-least-once:
    the same event can arrive multiple times, and not necessarily in order (e.g. `payment.succeeded` before `payment.created`).
    Stack: FastAPI + Postgres.

    Design the processing so that every payment state change effectively happens exactly once and ends in the correct state.
    Address failure modes and trade-offs. Up to ~600 words.
  reference: |
    - Verify the signature (HMAC) and timestamp at the edge; reject before doing any work.
    - Persist the raw event in an inbox table with a UNIQUE constraint on event_id (INSERT ... ON CONFLICT DO NOTHING) and return 2xx fast; process asynchronously (a worker pulling with SELECT ... FOR UPDATE SKIP LOCKED). Duplicates are absorbed by the database, not by application code.
    - Ordering: model the payment as a state machine with only legal transitions plus a version/occurred_at; a stale event never overwrites a newer state. An event that arrives too early (succeeded before created) either upserts the payment or is requeued with retry.
    - Apply the state update and side effects (email, ledger) in the same transaction via an outbox, so nothing is sent twice.
    - Failures: DB down -> return 5xx and let the provider retry; worker crashes mid-way -> the transaction rolls back and the event stays in the inbox; poison message -> attempt counter plus a DLQ with alerting. Periodic reconciliation against the provider's API as a safety net.
    - Trade-off: synchronous processing is simpler but couples the provider's response time to DB load; an inbox adds latency and one more component to operate.
  graders:
    - type: rubric
      criteria:
        - id: idempotency
          weight: 2
          description: Deduplicates at the storage layer (unique constraint on event id / idempotency key, ON CONFLICT) rather than relying on in-memory checks or "check then insert" races.
        - id: ordering
          weight: 2
          description: Handles out-of-order events explicitly (state machine with allowed transitions, versions/timestamps, never regressing state; handles an event for a payment not yet created).
        - id: ack_and_async
          description: Acknowledges quickly and processes asynchronously (inbox/queue), or justifies synchronous processing at 300/s.
        - id: failure_modes
          weight: 2
          description: Covers concrete failures - DB unavailable, worker crash mid-processing, poison messages/DLQ, side effects firing twice (outbox) - and reconciliation.
        - id: security
          description: Verifies webhook signatures / replay protection.
        - id: tradeoffs
          description: States explicit trade-offs and alternatives rather than a single prescriptive design.
    - type: length
      max_words: 800

- id: design_job_queue_choice
  category: system_design
  prompt: |
    The team needs a background-jobs system: 50 jobs/second on average, peaks of 500. Each job runs 1-30 seconds.
    Jobs must never be lost, and some must be scheduled with a delay (minutes to hours).
    Options on the table: Postgres with SKIP LOCKED (we already run Postgres), Redis, RabbitMQ, Kafka.
    What would you recommend, and why? What questions would you ask before deciding?
  reference: |
    Questions first: what is the latency SLA for queued jobs? Do jobs need ordering? What happens on duplicates (are jobs idempotent)? Who will operate the system and what already runs in production? How is load expected to grow?
    Recommendation: start with Postgres + SKIP LOCKED (or a library on top of it). 500 jobs/s is within its range, durability is transactional, a job can be enqueued in the same transaction as the business data (a built-in outbox), delay is just a run_at column, and there is no new component to operate.
    Watch: table bloat and vacuum on the queue table, and load on the primary. Move to RabbitMQ when throughput grows by an order of magnitude or the queue starts hurting the DB. Kafka is a log, not a job queue: no per-message ack, no built-in delay, head-of-line blocking within a partition. Redis needs persistence (AOF) configured to avoid losing jobs.
  graders:
    - type: rubric
      criteria:
        - id: clarifying_questions
          weight: 2
          description: Asks concrete clarifying questions (latency SLA, ordering, idempotency/duplicates, team ops capacity, growth) before or alongside the recommendation.
        - id: fit_to_workload
          weight: 2
          description: Correctly reasons about each option's semantics for THIS workload (Kafka is a log - per-message ack/delay are awkward; Redis durability depends on persistence config; Postgres handles ~500/s and gives transactional enqueue).
        - id: ops_and_ownership
          description: Weighs operational cost - a new system to run, on-call, existing expertise - not only features.
        - id: decision
          weight: 2
          description: Gives a clear recommendation with explicit conditions/metrics that would trigger revisiting it.

- id: design_distributed_rate_limiter
  category: system_design
  prompt: |
    Design rate limiting for a public API: 100 requests per minute per API key. Traffic goes through
    20 stateless API-gateway instances behind a load balancer; Redis is available.
    Requirements: limits roughly accurate across all instances, under 5 ms added latency at p99,
    and a clear answer for what happens when Redis is unavailable. Up to ~500 words.
  reference: |
    Algorithm: a single fixed window allows 2x bursts at window edges; a sliding log is exact but stores every
    timestamp; a sliding-window counter (current + weighted previous window) or a token bucket gives good
    accuracy with O(1) memory per key. Choose token bucket or sliding-window counter.
    Atomicity: do read-modify-write in one Redis round trip via a Lua script (or INCR + PEXPIRE inside MULTI)
    so concurrent gateways can't race past the limit. Key per API key, with TTL so idle keys expire.
    Latency: one round trip to a nearby Redis is ~1 ms; pipeline, use connection pooling, and shard with
    Redis Cluster by key so hot keys don't share a node. Optionally a small local token cache per gateway
    for very hot keys, trading a little accuracy for latency.
    Redis down: decide explicitly. Fail-open (allow) keeps the API up but removes protection; fail-closed
    protects backends but turns a Redis outage into an API outage. Usual answer: fail-open with a
    conservative per-instance local limit (100/20 per minute) and alert.
    Client contract: 429 with Retry-After and X-RateLimit-Limit/Remaining/Reset headers.
  graders:
    - type: rubric
      criteria:
        - id: algorithm_tradeoffs
          weight: 2
          description: Compares at least two algorithms (fixed window boundary bursts, sliding log memory, sliding-window counter / token bucket) and justifies the choice.
        - id: atomicity
          weight: 2
          description: Makes the check-and-increment atomic across instances (Lua script / MULTI) and explains the race it prevents.
        - id: failure_mode
          weight: 2
          description: Explicitly chooses fail-open vs fail-closed for Redis outages, with consequences and a fallback (e.g. local per-instance limit).
        - id: latency_scaling
          description: Addresses the latency budget and hot keys (round trips, pooling/pipelining, sharding, optional local cache).
        - id: client_contract
          description: Specifies the client-facing behaviour (429, Retry-After, rate-limit headers).
    - type: length
      max_words: 700
