# Category: general — everyday questions and advice.
# Mix one objectively checkable item (forced answer format + regex) with open-ended ones.

- id: gen_capacity_estimate
  category: general
  prompt: |
    For a service with 1,000,000 daily active users, each making 20 API requests per day on average,
    where peak traffic is 3x the daily average rate: what is the peak requests-per-second?
    Show brief reasoning, then end with a final line exactly in the form `ANSWER: <integer>` (rounded to the nearest integer).
  reference: |
    20M requests/day ÷ 86,400 s ≈ 231.5 RPS average; × 3 ≈ 694.4.
    ANSWER: 694
  grader:
    type: match
    must_include: ["ANSWER:\\s*69[45]\\b"]

- id: gen_consult_first_two_weeks
  category: general
  prompt: |
    I'm a mid-senior engineer. My team lead asked me to own extracting auth from our monolith into a separate service.
    I don't yet have a full picture of how much code depends on auth. How should I approach the first two weeks?
  reference: |
    Week 1 - map before writing code: list every place in the monolith that touches auth (sessions, permissions, tokens) and measure traffic. Identify stakeholders: consuming teams, security, SRE. Agree with the team lead on what "success" means and what is out of scope.
    Draft a short design doc: service boundaries, API contract, behaviour when the service is down (latency, fail-open vs fail-closed), and a strangler migration strategy: a facade inside the monolith, dual-run or shadow traffic, and a feature flag for instant rollback.
    Week 2 - review the doc with security and consuming teams, and run a small spike that moves one low-risk path (e.g. read-only token validation) behind a flag, with metrics.
    Communicate risks and estimates early. Ownership also means saying what you don't know yet.
  grader:
    type: rubric
    criteria:
      - id: discovery_first
        weight: 2
        description: Prioritizes mapping dependencies/usage and defining scope before writing code.
      - id: stakeholders
        description: Identifies stakeholders (consumers, security, ops) and alignment/communication steps - what ownership means beyond code.
      - id: migration_safety
        weight: 2
        description: Proposes an incremental migration with rollback (strangler/facade, feature flags, shadow traffic) and addresses failure behaviour of the new service.
      - id: actionable
        description: Concrete, sequenced steps for the two weeks rather than generic advice.

- id: gen_availability_math
  category: general
  prompt: |
    A service runs 3 replicas. Each replica is independently available 99.5% of the time.
    The service is up when at least 2 of the 3 replicas are up.
    What is the service's availability, as a percentage? Show brief reasoning, then end with a final line
    exactly in the form `ANSWER: <percentage with 4 decimal places>` (e.g. `ANSWER: 12.3456`).
  reference: |
    p = 0.995, q = 0.005. P(at least 2 up) = p^3 + 3*p^2*q = 0.985074875 + 0.014850375 = 0.99992525.
    ANSWER: 99.9925
  grader:
    type: match
    must_include: ["ANSWER:\\s*99\\.992[45]\\b"]
