name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.10 = the minimum the README promises; 3.12 is more permissive (e.g. nested f-string quotes)
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # node_tests graders (TypeScript tasks) need Node >= 22.6, which strips types natively.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Unit + golden tests (every task reference must pass its own graders)
        run: python -m pytest
      - name: Validate configs
        run: |
          python -m evalkit validate --config config.mock.yaml
          python -m evalkit validate --config config.yaml
      - name: Preflight (doctor) against mock models
        run: python -m evalkit doctor --config config.mock.yaml
      - name: End-to-end dry run with mock models
        run: python -m evalkit run --config config.mock.yaml --run ci
      - uses: actions/upload-artifact@v4
        with:
          name: mock-report-py${{ matrix.python-version }}
          path: results/ci/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Component + service tests
        run: npm test
      - name: Typecheck + build (output goes into the Python package)
        run: npm run build
