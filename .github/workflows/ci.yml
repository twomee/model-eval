name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pip install -r requirements.txt
      - name: Unit + golden tests (every task reference must pass its own graders)
        run: python -m pytest
      - name: Validate configs
        run: |
          python -m evalkit validate --config config.mock.yaml
          python -m evalkit validate --config config.yaml
      - name: End-to-end dry run with mock models
        run: python -m evalkit run --config config.mock.yaml --run ci
      - uses: actions/upload-artifact@v4
        with:
          name: mock-report
          path: results/ci/
