# Who competes, how they're called, and how much each category matters TO YOU.
#
# provider types:
#   cli           -> official CLI on your subscription (no API key). Prompt via stdin or "{prompt}" arg.
#   manual        -> you paste prompts into the chat UI (`python -m evalkit export`), save replies to files.
#   anthropic     -> Anthropic API (needs key)
#   openai_compat -> OpenAI / Gemini / Mistral / GLM APIs (need keys) — all speak /chat/completions
#
# CLI flags change between versions: verify each command with `<cli> --help` before the first run,
# then run `python -m evalkit doctor` (one trivial call per model/judge, fails in seconds).
# Last verified 2026-11-21: claude 2.1.330, codex 0.171.0. Gemini CLI: no individual-subscription
# login, so gemini is manual (Gemini app) or API (AI Studio key) below.
#
# ISOLATION: a CLI is an agent wrapped around a model. By default it loads your personal setup
# (claude: ~/.claude/CLAUDE.md, plugins, MCP, ~30k tokens of tools; codex: ~/.codex/AGENTS.md and
# config.toml with sandbox=danger-full-access). That changes the ANSWERS,
# so the flags below strip it, and pin the model so results stay comparable across CLI updates.

run:
  repetitions: 3        # same prompt N times -> measures consistency, smooths luck. manual is always 1.
  concurrency: 4        # global cap; cli/manual default to 1 per model (subscriptions rate-limit)
  temperature: 0.0      # ignored by CLIs
  max_tokens: 4096
  timeout_s: 300
  code_timeout_s: 30

# "Best for me" = your weights. Raise what you use daily, lower what you rarely need.
category_weights:
  backend_code: 2
  debugging: 2
  system_design: 1.5
  hebrew_text: 1
  general: 1

models:
  # ---------- subscriptions via official CLIs ----------
  #
  # LINEUP STRATEGY (a funnel, not a grid): every model x every effort is ~75 competitors x 66 calls.
  #   Stage 1 (below): every CURRENT-generation model at one everyday effort -> find the top 2-3.
  #   Stage 2: sweep effort only on those, e.g. variants: {effort: [low, medium, high, xhigh]}.
  # Legacy / previous-generation GPT models are left out: you'd never pick one over its successor.
  #
  # EFFORT: always pin it. Unpinned, codex in an isolated home runs with reasoning effort "none",
  # and claude uses whatever its default is this month. Effort names are NOT comparable across
  # vendors (claude "medium" != gpt "medium"): compare models at similar latency/cost instead.
  # Variant names always carry the suffix (claude-opus-medium) so adding values later keeps results.
  # Higher effort thinks longer: raise timeout_s on entries sweeping xhigh/max.

  # -p = headless print mode; JSON output gives token usage + an API-list-price cost estimate.
  # --safe-mode: no CLAUDE.md / plugins / hooks / MCP.  --tools "": answer in text, don't act.
  # (--bare would be cleaner but requires ANTHROPIC_API_KEY, i.e. not your subscription.)
  # Claude efforts: low, medium, high, xhigh, max.
  - name: claude-opus
    provider: cli
    command: ["claude", "-p", "--output-format", "json", "--safe-mode", "--tools", "",
              "--no-session-persistence", "--model", "claude-opus-5-5", "--effort", "{effort}"]
    parse: claude_json
    variants: {effort: [medium]}

  - name: claude-sonnet
    provider: cli
    command: ["claude", "-p", "--output-format", "json", "--safe-mode", "--tools", "",
              "--no-session-persistence", "--model", "claude-sonnet-5-5", "--effort", "{effort}"]
    parse: claude_json
    variants: {effort: [medium]}

  - name: claude-haiku
    provider: cli
    command: ["claude", "-p", "--output-format", "json", "--safe-mode", "--tools", "",
              "--no-session-persistence", "--model", "claude-haiku-5-5", "--effort", "{effort}"]
    parse: claude_json
    variants: {effort: [medium]}

  # Needs usage credits on top of the subscription ("Fable 5.2 requires usage credits").
  # - name: claude-fable
  #   provider: cli
  #   command: ["claude", "-p", "--output-format", "json", "--safe-mode", "--tools", "",
  #             "--no-session-persistence", "--model", "claude-fable-5-2", "--effort", "{effort}"]
  #   parse: claude_json
  #   variants: {effort: [medium]}

  # codex: --ignore-user-config does NOT skip ~/.codex/AGENTS.md, so `isolated_home` runs it with a
  # clean CODEX_HOME holding only a symlink to your login. -s read-only: can't write anywhere.
  # Models + supported efforts per model: ~/.codex/models_cache.json (evalkit validates against it).
  # GPT efforts: low, medium, high, xhigh, max (+ ultra on sol/astra/terra; luna tops out at max).
  - name: gpt-sol            # "fast, go-to model for coding and everyday work"
    provider: cli
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--json",
              "-m", "gpt-6.2-sol", "-c", 'model_reasoning_effort="{effort}"', "{prompt}"]
    parse: codex_jsonl
    isolated_home: &codex_home {env: CODEX_HOME, dir: ~/.cache/evalkit/codex-home, link: [~/.codex/auth.json]}
    variants: {effort: [medium]}
    # Stage 2 example:
    # variants: {effort: [low, medium, high, xhigh]}
    # timeout_s: 900

  - name: gpt-astra          # "most capable model for complex coding and professional work"
    provider: cli
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--json",
              "-m", "gpt-6.2-astra", "-c", 'model_reasoning_effort="{effort}"', "{prompt}"]
    parse: codex_jsonl
    isolated_home: *codex_home
    variants: {effort: [medium]}

  - name: gpt-terra          # "efficient; excels at visual understanding and computer use"
    provider: cli
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--json",
              "-m", "gpt-6.1-terra", "-c", 'model_reasoning_effort="{effort}"', "{prompt}"]
    parse: codex_jsonl
    isolated_home: *codex_home
    variants: {effort: [medium]}

  - name: gpt-luna           # "fast and affordable model for easier tasks"
    provider: cli
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--json",
              "-m", "gpt-6-luna", "-c", 'model_reasoning_effort="{effort}"', "{prompt}"]
    parse: codex_jsonl
    isolated_home: *codex_home
    variants: {effort: [medium]}

  # ---------- subscriptions without a CLI: copy/paste ----------
  # Gemini CLI has no individual-subscription login. Paste into the Gemini app, or use the
  # free-tier API (gemini-api below) - which is automated and repeatable, so prefer it if you can.
  - name: gemini
    provider: manual

  - name: mistral-lechat
    provider: manual

  - name: glm
    provider: manual
    # If your GLM subscription is the "Coding Plan", you likely have an API key for its coding endpoint.
    # Then replace the two lines above with:
    # provider: openai_compat
    # base_url: https://api.z.ai/api/coding/paas/v4
    # model: glm-5.3            # verify the exact id in your Z.ai console
    # api_key_env: ZAI_API_KEY

  # ---------- API alternatives (uncomment when you have keys) ----------
  # - name: claude-api
  #   provider: anthropic
  #   model: claude-opus-5-5
  #   api_key_env: ANTHROPIC_API_KEY
  #   price: {input: null, output: null}   # USD per 1M tokens - copy from the pricing page
  # - name: gpt-api
  #   provider: openai_compat
  #   base_url: https://api.openai.com/v1
  #   model: gpt-5.5                       # verify
  #   api_key_env: OPENAI_API_KEY
  #   params: {max_tokens: null, max_completion_tokens: 4096, temperature: null}  # reasoning models
  # - name: gemini-api
  #   provider: openai_compat
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  #   model: gemini-3.8-flash              # verify; free tier available in AI Studio
  #   api_key_env: GEMINI_API_KEY
  # - name: mistral-api
  #   provider: openai_compat
  #   base_url: https://api.mistral.ai/v1
  #   model: mistral-large-latest
  #   api_key_env: MISTRAL_API_KEY

# LLM-as-judge for rubric graders. A PANEL of judges from different vendors reduces
# self-preference bias (a model tends to like answers that sound like itself).
# Judge disagreement is shown per answer in the report.
#
# Only judges that actually WORK count: `doctor` warns when they cover fewer than 2 vendors.
judges:
  - name: judge-claude
    provider: cli
    command: ["claude", "-p", "--output-format", "json", "--safe-mode", "--tools", "",
              "--no-session-persistence", "--model", "claude-opus-5-5", "--effort", "medium"]
    parse: claude_json
  - name: judge-gpt
    provider: cli
    command: ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "-s", "read-only", "--json",
              "-m", "gpt-6.2-sol", "-c", 'model_reasoning_effort="medium"', "{prompt}"]
    parse: codex_jsonl
    isolated_home: *codex_home
